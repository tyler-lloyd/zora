version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - errorlint # errors.Is/As instead of == and type switches
    - gosec # zora runs as root on every node
    - misspell
    - nolintlint # every //nolint must name a linter and say why
    - unconvert
    - usestdlibvars
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Test-only helpers (fixtures, golden files, namespace harness): their
      # inputs come from the test itself.
      - path: (_test\.go|internal/golden/|internal/testns/)
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
