{{- /*
Reading Secrets is granted separately, and by default one namespace at a
time, so that installing zora does not hand it every Secret in the cluster.
To enable another namespace later without a chart upgrade:

  kubectl create rolebinding zora-secrets -n <namespace> \
    --clusterrole=<release>-secret-reader \
    --serviceaccount=<release namespace>:<release>-agent
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "zora.name" . }}-secret-reader
  labels: {{- include "zora.labels" . | nindent 4 }}
rules:
  # get only: zora reads the one Secret a pod's annotation names, and never
  # lists or watches.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
{{- if .Values.secrets.allNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zora.name" . }}-secret-reader
  labels: {{- include "zora.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "zora.name" . }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "zora.agent" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range .Values.secrets.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "zora.name" $ }}-secret-reader
  namespace: {{ . }}
  labels: {{- include "zora.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "zora.name" $ }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "zora.agent" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
