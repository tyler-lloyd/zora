name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Allow rootless network namespaces
        run: |
          sudo modprobe wireguard
          # Ubuntu 23.10+ blocks unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download modules (netns tests build plugins without network)
        run: go mod download
      - name: Unit, golden, property, netns and integration tests
        env:
          ZORA_REQUIRE_NETNS: "1" # a runner that can't do netns must fail, not skip
        run: make test cover

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=60s

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          args="--set cluster.podCIDRs={10.244.0.0/16}"
          helm lint deploy/helm/zora $args
          helm template zora deploy/helm/zora -n zora-system $args --kube-version 1.33.0 >/dev/null
          helm template zora deploy/helm/zora -n zora-system $args --kube-version 1.33.0 --set secrets.allNamespaces=true | grep -q 'kind: ClusterRoleBinding'
          # The required values must be enforced: pod CIDRs always, Service
          # CIDRs where the cluster is too old to be asked.
          ! helm template zora deploy/helm/zora -n zora-system --kube-version 1.33.0 2>/dev/null
          ! helm template zora deploy/helm/zora -n zora-system $args --kube-version 1.32.0 2>/dev/null
          helm template zora deploy/helm/zora -n zora-system $args --kube-version 1.32.0 --set 'cluster.serviceCIDRs={10.96.0.0/12}' >/dev/null

  # Builds the image and installs the chart into a real cluster.
  e2e-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cni: [kindnet, flannel, cilium]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: sudo modprobe wireguard
      - run: hack/e2e-smoke.sh
        env:
          CNI: ${{ matrix.cni }}

